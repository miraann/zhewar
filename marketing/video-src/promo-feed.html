<!doctype html>

<style>

html,body{width:540px;height:675px;overflow:hidden;background:#05070f}

/* ── background ── */

/* ── intro / outro ── */

.bigName{font-size:64px;font-weight:700;line-height:1.15;text-align:center}

.tagline{color:#cbd5e1;font-size:21px;text-align:center}

.divider i{display:block;height:2px;border-radius:2px;width:90px}

.grad{background:linear-gradient(90deg,#93c5fd,#38bdf8 45%,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}

/* hook */
.hookLine{position:absolute;left:0;right:0;text-align:center;font-size:42px;font-weight:700;line-height:1.3}
.rmNode{position:absolute;width:86px;height:86px;margin:-43px 0 0 -43px;border-radius:28px;background:linear-gradient(160deg,#1b2645,#111a33);border:1.5px solid rgba(255,255,255,.15);color:#93c5fd}

.rmLbl{position:absolute;width:130px;margin-left:-65px;text-align:center;font-size:17px;font-weight:700;color:#e2e8f0}

/* headers */
#segs{left:0;right:0;top:16px;display:flex;justify-content:center;gap:6px}
.seg{width:54px;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.seg b{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(90deg,#93c5fd,#3b82f6);width:0}
.hdr{position:absolute;left:0;right:0;top:36px;display:flex;flex-direction:column;align-items:center}

.ht{margin-top:10px;font-size:37px;font-weight:700;line-height:1.25;text-align:center;white-space:nowrap}

/* phone */
#phone{left:105px;top:196px;width:330px;height:700px}

.frame{position:absolute;inset:0;border-radius:54px;background:linear-gradient(150deg,#5b6474 0%,#1a2130 16%,#0b0f17 55%,#3a4252 100%);box-shadow:0 40px 90px rgba(0,0,0,.7)}
.frame:before{content:'';position:absolute;inset:3px;border-radius:51px;background:#04060a}
.pbtn{position:absolute;width:4px;border-radius:2px;background:#3a4252}
.screen{position:absolute;left:9px;top:9px;width:312px;height:682px;border-radius:46px;overflow:hidden;background:#fafafa}

.upill{height:34px;flex:1;border-radius:17px;background:#f1f3f6;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Segoe UI',sans-serif;font-size:14px;color:#334155}
.area{position:absolute;left:0;right:0;top:92px;bottom:0;overflow:hidden;background:#fafafa}
.appstripes{position:absolute;inset:0;background-image:repeating-linear-gradient(-45deg,transparent 0 24px,#ef4444 24px 38px,transparent 38px 62px,#3b82f6 62px 76px,transparent 76px 100px);background-size:141px 141px;opacity:.045}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:16px;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}

.cchip{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.cav{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid #e2e8f0;flex-shrink:0}

.cname{font-size:14px;font-weight:700;color:#0f172a;line-height:1.2}
.cph{font-size:10.5px;color:#94a3b8;margin-top:2px;direction:ltr;text-align:right;font-family:'Segoe UI',sans-serif;white-space:nowrap}

.strip{display:flex;gap:5px;direction:ltr}

.day .dn{font-size:7.5px;font-weight:700;color:#64748b;text-align:center;line-height:1.2;width:100%;padding:0 1px;white-space:nowrap;overflow:hidden}

.day .dt{width:6px;height:6px;border-radius:50%;background:transparent}

.day.sel{background:#2563eb;border-color:#2563eb;box-shadow:0 4px 10px rgba(147,197,253,.6)}.day.sel .dn{color:rgba(255,255,255,.85)}.day.sel .dd{color:#fff}.day.sel .dt{background:rgba(255,255,255,.45)}

.legend{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}

.slot.g{background:#10b981}.slot.a{background:#fbbf24}.slot.r{background:#dc2626}.slot.s{background:#2563eb;box-shadow:0 4px 12px rgba(59,130,246,.45)}
.skel{height:56px;border-radius:16px;background:#e9eef4}
.ctaw{position:absolute;left:0;right:0;bottom:0;padding:56px 16px 26px;background:linear-gradient(to top,#fff 0%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 100%);z-index:3}
.empty{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.ecirc{width:64px;height:64px;border-radius:50%;background:#eff6ff;border:1px solid #bfdbfe;color:#60a5fa;display:flex;align-items:center;justify-content:center}

/* summary / receipt */
.back{display:flex;align-items:center;gap:6px;color:#94a3b8;font-size:14px;margin-bottom:12px}
.tkw{position:relative;margin-top:16px}
.notch{position:absolute;width:24px;height:24px;border-radius:50%;background:#f1f5f9;border:1px solid rgba(226,232,240,.8);z-index:2}

.prof{display:flex;flex-direction:column;align-items:center;padding:18px 24px 14px;gap:3px}
.bigav{width:84px;height:84px;border-radius:50%;padding:4px;background:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.1),0 4px 8px rgba(0,0,0,.1)}
.bigav>div{width:100%;height:100%;border-radius:50%;overflow:hidden}
.bigav svg{width:100%;height:100%;display:block}
.pn2{font-size:19px;font-weight:700;color:#1f2937;margin-top:6px}
.pp{font-size:13px;color:#6b7280;direction:ltr;font-family:'Segoe UI',sans-serif}
.tear{border-top:2px dashed #e5e7eb;margin:0 16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.gc{display:flex;align-items:center;gap:10px;padding:10px;background:#f9fafb;border-radius:16px;border:1px solid #f3f4f6}
.gi{width:34px;height:34px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.gl{font-size:10px;color:#9ca3af;font-weight:500}
.gv{font-size:13px;font-weight:700;color:#374151;margin-top:1px;line-height:1.25;white-space:nowrap}
.barcode{width:180px;height:30px;background:repeating-linear-gradient(90deg,#0f172a 0px,#0f172a 2px,transparent 2px,transparent 4px,#0f172a 4px,#0f172a 5px,transparent 5px,transparent 8px,#0f172a 8px,#0f172a 9px,transparent 9px,transparent 12px)}
.okc{position:relative;width:76px;height:76px;border-radius:50%;background:#ecfdf5;border:2px solid #a7f3d0;color:#10b981;box-shadow:0 4px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center}
.ping{position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(52,211,153,.55)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid}

/* ── scanner ── */
#scanWrap{left:80px;top:250px;width:380px;height:380px}
.sring{position:absolute;inset:0;border-radius:50%}
#sInner{position:absolute;inset:4px;border-radius:50%;background:#050a16}

.stitle{left:0;right:0;top:212px;text-align:center;font-size:15px;color:rgba(255,255,255,.6)}
.stx{position:absolute;left:0;right:0;top:668px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 34px}

// ─────────────────────────────────────────────────────────────────────────────
//  Per-frame update
// ─────────────────────────────────────────────────────────────────────────────
let FLY = null;           // measured target for the photo → form avatar flight

const feedEnv = t => Math.min(1, Math.max(0, Math.min((t - 12.4) / 0.45, (23.8 - t) / 0.45)));
function seek(t) {
  const w = feedEnv(t);
  $('wideBox').style.opacity = w; $('stage').style.opacity = 1 - w;
  RT = t;
  const b = warp(t);
  bgU(t, b); introU(b); hookU(b); hdrU(b); phoneU(b); scanU(b); notifU(b); outroU(b); tapU(b); showU(t);
  vis('flash', b >= SC.flash && b < SC.flash + .5 ? .8 * (1 - P(b, SC.flash, .45, E.out)) : 0);
  vis('fade', Math.max(1 - P(t, 0, .5), P(t, DUR - .8, .8, E.io)));
}

function bgU(t, b) {
  const o = (t * 12) % 141;
  $('bgStripes').style.backgroundPosition = `${o}px ${o}px`;
  tf('blobB', `translate(${430 + Math.sin(t * .35) * 40}px,${170 + Math.cos(t * .3) * 50}px)`);
  tf('blobR', `translate(${110 + Math.cos(t * .28) * 40}px,${800 + Math.sin(t * .33) * 50}px)`);
  tf('blobG', `translate(270px,330px)`);
  vis('blobG', Math.max(1 - P(b, 4.6, 1), P(b, TL.outro, 1)));
  vis('bgScan', env(b, SC.zoom, SC.flyEnd, .8, .9));
}

function introU(t) {
  if (t > TL.s1 + .5) { vis('intro', 0); return; }
  vis('intro', 1);
  const pin = P(t, .25, 1.1, E.back);
  // logo: pop in, then shrink to the top for the hook
  const mv = P(t, 4.55, .8, E.io);
  const sc = lerp(lerp(.55, 1, pin), .5, mv);
  const ty = lerp(0, -178, mv);
  const out = P(t, 9.7, .5, E.in);
  vis('iLogo', Math.min(P(t, .25, .5), 1 - out));
  tf('iLogo', `translateY(${ty - out * 30}px) scale(${sc})`);
  tf('iRing', `rotate(${t * 360 / 3.5}deg)`);
  tf('iOrbit1', `rotate(${-t * 20}deg)`);
  tf('iOrbit2', `rotate(${t * 12}deg)`);
  vis('iOrbit1', 1 - mv); vis('iOrbit2', 1 - mv);
  const ex = P(t, 4.45, .5, E.in);
  const item = (id, a) => { const p = P(t, a, .75); vis(id, p * (1 - ex)); tf(id, `translateY(${(1 - p) * 26 - ex * 30}px)`); };
  item('iGold', .95); item('iName', 1.15); item('iTag', 1.85);
  const pd = P(t, 1.55, .8);
  vis('iDiv', pd * (1 - ex)); tf('iDiv', `scaleX(${pd}) translateY(${-ex * 30}px)`);
}

function hookU(t) {
  if (t < TL.hook - .1 || t > TL.s1 + .3) { vis('hook', 0); return; }
  vis('hook', 1);
  const ex = P(t, 9.7, .5, E.in);
  const line = (id, a) => { const p = P(t, a, .7); vis(id, p * (1 - ex)); tf(id, `translateY(${(1 - p) * 30 - ex * 24}px)`); };
  line('hk1', 5.15); line('hk2', 5.45); line('hk3', 6.25);
  const lp = P(t, 6.65, 1.3, E.io);
  vis('rmLine', 1 - ex); tf('rmLine', `scaleX(${lp})`);
  for (let i = 0; i < 4; i++) {
    const p = P(t, 6.7 + i * .3, .5, E.back);
    vis('rm' + i, clamp(p * 3) * (1 - ex));
    let extra = '';
    if (i === 2) { // highlight the face-scan node
      const g = P(t, 7.9, .6);
      const pulse = .5 + .5 * Math.sin(t * 5);
      $('rm2').style.borderColor = `rgba(52,211,153,${.15 + g * .7})`;
      $('rm2').style.boxShadow = `0 0 ${g * (22 + pulse * 16)}px rgba(16,185,129,${g * .55})`;
      $('rm2').style.color = g > .5 ? '#6ee7b7' : '#93c5fd';
      extra = ` scale(${1 + g * .08})`;
    }
    tf('rm' + i, `scale(${p})${extra}`);
    const pl = P(t, 6.9 + i * .3, .5);
    vis('rl' + i, pl * (1 - ex)); tf('rl' + i, `translateY(${(1 - pl) * 12}px)`);
  }
}

function stepAt(t) {
  if (t < TL.s2) return 0; if (t < TL.s3) return 1; if (t < TL.s4) return 2;
  if (t < TL.s5) return 3; if (t < TL.s6) return 4; return 5;
}
function hdrU(t) {
  vis('segs', env(t, TL.s1, TL.outro, .5, .5) * P(RT, SHOW_END - .1, .5));
  const starts = [TL.s1, TL.s2, TL.s3, TL.s4, TL.s5, TL.s6];
  for (let i = 0; i < 6; i++) $('seg' + i).style.width = (P(t, starts[i], .6, E.io) * 100) + '%';
  const H = [['h1', 10.4, 14.95], ['h2', 15.15, SC.out + .2], ['h3', 31.95, 39.1], ['h4', 39.35, 47.1], ['h5', 47.35, 53.1], ['h6', 53.35, 60.35]];
  const nf = notifVis(t);
  H.forEach(([id, a, b]) => {
    let o = env(t, a, b, .5, .35);
    if (id === 'h6') o *= 1 - nf;
    if (id === 'h1') o *= P(RT, SHOW_END - .1, .5);   // step 1 starts after the homepage tour
    vis(id, o);
    tf(id, `translateY(${(1 - (id === 'h1' ? P(RT, SHOW_END, .5) : P(t, a, .5))) * 18}px)`);
  });
  const sw = P(t, 57.2, .4);
  vis('h6a', 1 - sw); vis('h6b', sw);
}

// ── phone ───────────────────────────────────────────────────────────────────
const SCREENS = [
  ['scHome', 10.2, 14.95], ['scReg', 14.75, 19.1], ['scForm', 31.7, 39.45],
  ['scDT', 39.2, 47.45], ['scSum', 47.2, 53.45], ['scOk', 53.2, 61.2],
];
function phoneU(t) {
  const on1 = t >= TL.s1 - .05 && t < 19.05, on2 = t >= SC.fly && t < TL.outro + .7;
  if (!on1 && !on2) { vis('phone', 0); vis('phoneGlow', 0); return; }
  let y = 0, s = 1, o = 1, rotY = Math.sin(RT * .6) * 3, rotX = Math.cos(RT * .5) * 1.5;
  const fl = Math.sin(RT * 1.2) * 4;
  if (on1) {
    y = (1 - P(t, TL.s1, .95, E.out5)) * 780;
    const z = P(t, SC.zoom, .65, E.in);
    s = lerp(1, 2.7, z); o = 1 - P(t, SC.zoom + .08, .32);
    if (z > 0) { rotY *= 1 - z; rotX *= 1 - z; }
  } else {
    const p = P(t, SC.fly + .2, .8, E.out);
    s = lerp(1.1, 1, p); o = p;
    const ex = P(t, TL.outro - .55, .6, E.in);
    y = ex * 260; o *= 1 - ex; s *= 1 - ex * .1;
  }
  $('phone').style.transformOrigin = '165px 390px';
  vis('phone', o);
  tf('phone', `translateY(${y + fl}px) perspective(1600px) rotateY(${rotY}deg) rotateX(${rotX}deg) scale(${s})`);
  vis('phoneGlow', o * .9); tf('phoneGlow', `translateY(${y}px)`);

  $('appStripes').style.backgroundPosition = `${(RT * 6) % 141}px ${(RT * 6) % 141}px`;
  $('hPole').style.backgroundPosition = `${(RT * 47) % 113}px 0`;
  // screens: slide in from the left (RTL "forward"), slide out to the right
  SCREENS.forEach(([id, a, b]) => {
    const pin = P(t, a, .45, E.out), pout = P(t, b - .45, .45, E.in);
    const o2 = (a <= TL.s1 + .01 ? (t >= a ? 1 : 0) : pin) * (1 - pout);
    vis(id, o2);
    tf(id, `translateX(${(1 - pin) * -60 + pout * 60}px)`);
  });
  tf('homeRing', `rotate(${RT * 360 / 3.5}deg)`);
  tf('regRing', `rotate(${RT * 360 / 4}deg)`);
  tf('formRing', `rotate(${RT * 360 / 4}deg)`);

  // reg → camera overlay
  vis('camOv', P(t, 17.95, .3));
  tf('miniRing', `rotate(${t * 360 / 2.2}deg)`);
  tf('miniSpin', `rotate(${t * 360 / .8}deg)`);

  formU(t); dtU(t); sumU(t); okU(t);
}

const PLACEHOLDER = { fName: 'ناوی تەواو', fPhone: '+964 7XX XXX XXXX', fNote: 'ئایا تێبینییەکت هەیە؟ وەک جۆری مووی، خواستەکانت…' };
function typed(id, str, a, b, t, focus) {
  const chars = Array.from(str);
  const n = Math.round(clamp((t - a) / (b - a)) * chars.length);
  const caret = focus && (t < b + .05 || Math.floor(t * 2.4) % 2 === 0) ? '<span class="caret"></span>' : '';
  $(id).innerHTML = n === 0
    ? `${caret}<span class="ph">${PLACEHOLDER[id]}</span>`
    : chars.slice(0, n).join('') + caret;
}
function formU(t) {
  if (t < SC.fly - .1 || t > TL.s4 + .5) return;
  vis('formAvImg', P(t, SC.flyEnd - .08, .12, E.lin));
  const bp = P(t, SC.flyEnd + .05, .4, E.back);
  vis('formBadge', clamp(bp * 2)); tf('formBadge', `scale(${bp})`);
  const F = [['fName', 32.8, 34.45], ['fPhone', 34.45, 36.05], ['fNote', 36.05, 37.3]];
  TYPE.forEach((f, i) => {
    const focus = t >= F[i][1] && t < F[i][2];
    typed(f.id, f.str, f.a, f.b, t, focus);
    $(f.id + 'Box').classList.toggle('focus', focus);
  });
  const saving = t > 38.28;
  $('btnStart').className = 'btn ' + (saving ? 'dis' : 'blue');
  $('btnStartTxt').innerHTML = saving
    ? `<span class="spin" style="width:20px;height:20px;border-color:#94a3b8;border-top-color:transparent;transform:rotate(${t * 450}deg)"></span>چاوەڕوانبە...`
    : `دەستپێبکە ${ic('arrow-left', 18)}`;
}

function dtU(t) {
  if (t < TL.s4 - .2 || t > TL.s5 + .5) return;
  const selD = t >= 40.75;
  $('day' + SEL_DAY).className = 'day' + (selD ? ' sel' : '');
  vis('dtLblA', selD ? 0 : 1); vis('dtLblB', selD ? 1 : 0);
  vis('dtEmpty', selD ? 0 : 1);
  vis('dtSkel', selD && t < 41.35 ? .5 + .5 * Math.sin(t * 12) * .5 + .25 : 0);
  for (let i = 0; i < SLOTS.length; i++) {
    const p = P(t, 41.35 + i * .045, .35, E.back);
    const el = vis('slot' + i, clamp(p * 2));
    tf(el, `scale(${lerp(.8, 1, p)})`);
    if (i === SEL_SLOT) el.className = 'slot ' + (t >= 43.95 ? 's' : SLOT_ST[i]);
  }
  const ok = t >= 43.95;
  $('ctaDT').className = 'btn ' + (ok ? 'blue' : 'dis');
  $('ctaDTa').style.display = ok ? 'none' : 'inline';
  $('ctaDTb').style.display = ok ? 'flex' : 'none';
}

function sumU(t) {
  if (t < TL.s5 - .2 || t > TL.s6 + .5) return;
  $('pole1').style.backgroundPosition = `${(t * 47) % 113}px 0`;
  const p1 = P(t, 47.45, .6), p2 = P(t, 47.8, .6);
  vis('sumProf', p1); tf('sumProf', `translateY(${(1 - p1) * 16}px)`);
  vis('sumGrid', p2); tf('sumGrid', `translateY(${(1 - p2) * 16}px)`);
  const busy = t >= 51.98;
  $('ctaSum').className = 'btn ' + (busy ? 'load' : 'blue');
  $('ctaSumA').style.display = busy ? 'none' : 'inline';
  $('ctaSumB').style.display = busy ? 'flex' : 'none';
  tf('sumSpin', `rotate(${t * 450}deg)`);
}

function okU(t) {
  if (t < TL.s6 - .2) return;
  $('pole2').style.backgroundPosition = `${(t * 47) % 113}px 0`;
  const c = P(t, 53.45, .5, E.back);
  vis('okC', clamp(c * 2)); tf('okC', `scale(${c})`);
  const pg = ((t - 53.6) % 2.5) / 2.5;
  vis('okPing', t > 53.6 ? (1 - pg) * .9 : 0); tf('okPing', `scale(${1 + pg * .45})`);
  const tx = P(t, 53.65, .5); vis('okTx', tx); tf('okTx', `translateY(${(1 - tx) * 14}px)`);
  const tk = P(t, 53.85, .6); vis('okTk', tk); tf('okTk', `translateY(${(1 - tk) * 22}px)`);
  const cf = P(t, 57.35, .35);
  vis('bdgP', 1 - cf); vis('bdgC', cf); tf('bdgC', `scale(${lerp(.6, 1, P(t, 57.35, .4, E.back))})`);
  vis('stP', 1 - cf); vis('stC', cf);
  vis('stGlow', t > 57.35 ? Math.max(0, 1 - (t - 57.35) / 1.6) : 0);
}

// ── face scan ───────────────────────────────────────────────────────────────
function phase(t) {
  if (t < SC.loadEnd) return 'loading';
  if (t < SC.lock) return 'searching';
  if (t < SC.capt) return 'found';
  return 'captured';
}
function facePose(t) {
  if (t >= SC.capt) return [0, 4, 0, 1.2];
  const ein = P(t, SC.faceIn, 1.0, E.out);
  const wob = 1 - P(t, SC.cA, 1.2, E.io);
  let tx = lerp(110, 34, ein) + Math.sin(t * 1.7) * 3 * wob;
  let ty = 22 + Math.sin(t * 2.3) * 2.2 * wob;
  let r = 14 + Math.sin(t * 1.3) * 2 * wob;
  let s = .95;
  const c = P(t, SC.cA, SC.cB - SC.cA, E.io);
  tx = lerp(tx, 0, c); ty = lerp(ty, 4, c); r = lerp(r, 0, c); s = lerp(s, 1.2, c);
  const idle = c >= 1 ? 1 : 0;
  tx += Math.sin(t * 1.1) * .5 * idle; ty += Math.sin(t * 1.6) * .4 * idle; r += Math.sin(t * .9) * .4 * idle;
  return [tx, ty, r, s];
}
function blinkAt(t) {
  const a = SC.blink;
  if (t < a || t > a + .55) return 0;
  if (t < a + .14) return E.io((t - a) / .14);
  if (t < a + .3) return 1;
  return 1 - E.io((t - a - .3) / .25);
}

function scanU(t) {
  const onA = t >= SC.in - .05 && t < SC.flyEnd + .1;
  if (!onA) { vis('scan', 0); return; }
  vis('scan', 1);
  const ph = phase(t);

  // wrap: zoom-in entrance → push-in on blink → move up for benefits → fly into form avatar
  const pin = P(t, SC.in, .65, E.out);
  let tx = 0, ty = lerp(146, 0, pin), s = lerp(.43, 1, pin);
  const push = P(t, SC.pushA, 1.4, E.io) * (1 - P(t, SC.capt, .5, E.io));
  s *= 1 + push * .06;
  const up = P(t, SC.up, .85, E.io);
  ty = lerp(ty, -122, up); s = lerp(s, .6, up);
  if (FLY) {
    const f = P(t, SC.fly, SC.flyEnd - SC.fly, E.io);
    tx = lerp(tx, FLY.x - 270, f); ty = lerp(ty, FLY.y - 440, f); s = lerp(s, FLY.s, f);
  }
  vis('scanWrap', Math.min(P(t, SC.in, .3), t > SC.flyEnd - .05 ? 0 : 1));
  tf('scanWrap', `translate(${tx}px,${ty}px) scale(${s})`);
  const flying = P(t, SC.fly, .35);
  vis('sTitle', env(t, SC.in + .2, SC.up + .2, .4, .3));

  // ring
  const ringO = 1 - flying;
  const ring = $('sRing');
  vis(ring, ringO); vis('sInner', ringO);
  if (ph === 'loading' || ph === 'searching') {
    ring.style.background = 'conic-gradient(#f59e0b 0deg,#f59e0b 180deg,transparent 180deg)';
    tf(ring, `rotate(${t * 360 / 2.2}deg)`);
  } else if (ph === 'found') {
    ring.style.background = 'conic-gradient(#10b981 0deg,#6ee7b7 90deg,#10b981 180deg,#059669 270deg,#10b981 360deg)';
    tf(ring, `rotate(${t * 360 / 1.2}deg)`);
  } else {
    ring.style.background = '#10b981'; tf(ring, 'none');
  }
  vis('sOuterA', ph === 'searching' ? (.55 + .45 * Math.sin(t * Math.PI)) * ringO : 0);
  vis('sOuterG', (ph === 'found' || ph === 'captured') ? ringO * (ph === 'found' ? 1 : .7) : 0);
  const bcol = ph === 'found' ? '#10b981' : '#fbbf24';
  for (let i = 0; i < 4; i++) { const b = $('bk' + i); b.style.borderColor = bcol; vis(b, ph === 'searching' || ph === 'found' ? 1 : 0); }
  const bd = vis('sBadge', ph === 'found' ? P(t, SC.lock, .35) : 0);
  tf(bd, `translateX(-50%) scale(${lerp(.7, 1, P(t, SC.lock, .35, E.back))})`);
  vis('sBadgeDot', .4 + .6 * Math.abs(Math.sin(t * 3)));

  // camera content
  vis('sDim', ph === 'loading' ? 1 : 1 - P(t, SC.loadEnd, .3));
  tf('sSpin', `rotate(${t * 360 / .8}deg)`);
  const lt = ((t - SC.loadEnd) % 2.2) / 2.2;
  const lineEl = vis('sLine', ph === 'searching' ? (lt < .08 ? lt / .08 : lt > .92 ? (1 - lt) / .08 : 1) : 0);
  lineEl.style.top = (18 + lt * 64) + '%';
  const sw = P(t, SC.lock, .9, E.io);
  vis('sSweep', ph === 'found' && sw < 1 ? 1 : 0); $('sSweep').style.top = (lerp(-90, 348, sw)) + 'px';
  const prog = ph === 'found' ? clamp((t - SC.lock) / 3.4) * 100 : 0;
  $('sArc').style.background = `conic-gradient(rgba(52,211,153,.85) ${prog * 3.6}deg, transparent ${prog * 3.6}deg)`;
  vis('sArc', ph === 'found' ? 1 : 0);
  $('sBar').style.width = prog + '%';
  const okp = P(t, SC.capt + .1, .45, E.back);
  vis('sOk', ph === 'captured' ? clamp(P(t, SC.capt, .2)) * (1 - flying) : 0);
  tf('sOkC', `scale(${okp})`);
  $('cam').style.boxShadow = `0 0 0 ${flying * 3}px #bfdbfe`;

  // face pose + blink
  const [fx, fy, fr, fs] = facePose(t);
  $('scpose').setAttribute('transform', poseStr(fx, fy, fr, fs));
  const bl = blinkAt(t);
  $('sclidR').setAttribute('d', lidD(82, bl)); $('sclashR').setAttribute('d', lashD(82, bl));
  $('sclidL').setAttribute('d', lidD(118, bl)); $('sclashL').setAttribute('d', lashD(118, bl));

  // detection box (axis aligned, like face-api)
  const box = $('scbox');
  const boxO = ph === 'searching' ? P(t, SC.partial, .3) : ph === 'found' ? 1 - P(t, SC.lmA + .6, .5) : 0;
  if (boxO > 0) {
    const rr = Math.abs(fr) * Math.PI / 180;
    const hw = fs * (44 * Math.cos(rr) + 54 * Math.sin(rr)), hh = fs * (56 * Math.cos(rr) + 44 * Math.sin(rr));
    const cx = 100 + fx, cy = 93 + fy;
    box.setAttribute('x', cx - hw); box.setAttribute('y', cy - hh); box.setAttribute('width', hw * 2); box.setAttribute('height', hh * 2);
    box.setAttribute('stroke', ph === 'found' ? '#34d399' : '#fbbf24');
    box.setAttribute('stroke-dashoffset', -t * 12);
  }
  box.setAttribute('opacity', boxO);

  // landmarks + mesh
  const lmOn = (ph === 'found' || (ph === 'captured' && t < SC.capt + .25));
  const lmFade = ph === 'captured' ? 1 - P(t, SC.capt, .2) : 1;
  const blinkDim = 1 - .7 * clamp(1 - Math.abs(t - (SC.blink + .2)) / .45);
  $('scpts').setAttribute('opacity', lmOn ? lmFade * blinkDim : 0);
  $('scmesh').setAttribute('opacity', lmOn ? lmFade * blinkDim : 0);
  if (lmOn) {
    const L = landmarks(bl);
    const glowEye = bl > 0 ? 1 : 0;
    for (let i = 0; i < 68; i++) {
      const p = P(t, SC.lmA + i * (1.25 / 68), .28, E.back);
      const g = $('lp' + i);
      const eyeBoost = (i >= 36 && i <= 47) ? 1 + glowEye * .15 : 1;
      g.setAttribute('transform', `translate(${L[i][0]} ${L[i][1]}) scale(${Math.max(0, p) * eyeBoost})`);
    }
    MESH.forEach((seq, j) => {
      const d = 'M' + seq.map(k => L[k][0].toFixed(2) + ',' + L[k][1].toFixed(2)).join('L');
      const el = $('lm' + j);
      el.setAttribute('d', d);
      el.setAttribute('stroke-dashoffset', 1 - P(t, SC.meshA + j * (1.1 / MESH.length), .4, E.io));
    });
  }

  // instruction text
  const txt = (id, a, b) => { const o = env(t, a, b, .3, .25); vis(id, o); tf(id, `translateY(${(1 - P(t, a, .3)) * 10}px)`); };
  txt('txLoad', SC.in + .3, SC.loadEnd);
  txt('txSearch', SC.loadEnd, SC.partial);
  txt('txPartial', SC.partial, SC.lock);
  txt('txFound', SC.lock, SC.capt);
  txt('txCapt', SC.capt, SC.up + .15);
  for (let i = 0; i < 3; i++) {
    const v = .3 + .7 * (.5 + .5 * Math.sin((t - i * .2) * Math.PI * 2 / 1.4));
    vis('dA' + i, v); vis('dB' + i, v);
    tf('dA' + i, `scale(${.8 + .4 * v})`); tf('dB' + i, `scale(${.8 + .4 * v})`);
  }
  const bt = $('blinkTx');
  const pulse = t > SC.pushA && t < SC.blink + .4 ? .5 + .5 * Math.sin(t * 9) : 0;
  bt.style.textShadow = `0 0 ${pulse * 18}px rgba(52,211,153,.9)`;
  const sb = P(t, SC.btns, .4, E.back);
  vis('sBtns', clamp(sb * 2) * (1 - P(t, SC.up, .25)));
  tf('sBtns', `translateY(${(1 - sb) * 16}px)`);
  const pr = bump(t, SC.use, .14);
  $('btnUse').style.scale = 1 - pr * .05;

  // feature chips
  const chip = (id, a, b) => { const o = env(t, a, b, .4, .3); vis(id, o); tf(id, `translateX(-50%) translateY(${(1 - P(t, a, .4)) * 20}px) scale(${lerp(.92, 1, P(t, a, .4, E.back))})`); };
  chip('fc0', SC.partial + .1, SC.cB);
  chip('fc1', SC.lmA + .1, SC.blink - .25);
  chip('fc2', SC.blink - .2, SC.up + .1);

  // benefits
  const bo = 1 - P(t, SC.out, .4, E.in);
  const bT = P(t, SC.benT, .5);
  vis('benT', bT * bo); tf('benT', `translateY(${(1 - bT) * 20}px)`);
  SC.ben.forEach((a, i) => {
    const p = P(t, a, .55, E.out);
    vis('bn' + i, p * bo);
    tf('bn' + i, `translateX(${(1 - p) * -60}px)`);
  });
}

// ── notification ────────────────────────────────────────────────────────────
function notifVis(t) { return env(t, 54.9, 57.3, .35, .35); }
function notifU(t) {
  const o = notifVis(t);
  vis('notif', o);
  const pin = P(t, 54.9, .5, E.back), pout = P(t, 56.95, .35, E.in);
  tf('notif', `translateY(${(1 - pin) * -150 - pout * 160}px)`);
  const done = t >= 56.25;
  $('nfBtn').style.background = done ? '#10b981' : '#2563eb';
  $('nfA').style.display = done ? 'none' : 'inline';
  $('nfB').style.display = done ? 'flex' : 'none';
}

// ── outro ───────────────────────────────────────────────────────────────────
function outroU(t) {
  if (t < TL.outro - .1) { vis('outro', 0); return; }
  vis('outro', 1);
  const l = P(t, TL.outro + .15, 1.0, E.back);
  vis('oLogo', clamp(l * 2)); tf('oLogo', `scale(${lerp(.4, 1, l)})`);
  tf('oRing', `rotate(${t * 360 / 3.5}deg)`); tf('oOrbit', `rotate(${-t * 18}deg)`);
  const it = (id, a, dy = 24) => { const p = P(t, a, .7); vis(id, p); tf(id, `translateY(${(1 - p) * dy}px)`); };
  it('oName', 61.0); it('oCta', 61.35);
  const u = P(t, 61.85, .7, E.back);
  vis('oUrl', clamp(u * 2)); tf('oUrl', `scale(${lerp(.7, 1, u)})`);
  it('oTag', 62.4); it('oSub', 62.7); it('oAddr', 63.0);
}

// ── tap indicator ───────────────────────────────────────────────────────────
function tapU(t) {
  const tp = TAPS.find(x => t >= x.t - .55 && t <= x.t + .5);
  TAPS.forEach(x => { const el = $(x.id); if (el && x.id !== 'btnUse') el.style.scale = 1 - bump(t, x.t, .14) * .05; });
  if (!tp || (RT >= SHOW_A && RT < SHOW_END)) { vis('tap', 0); return; }
  const el = $(tp.id);
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const a = P(t, tp.t - .55, .4, E.out);
  const out = P(t, tp.t + .2, .3, E.in);
  vis('tap', a * (1 - out));
  const press = bump(t, tp.t, .12);
  const drift = (1 - a) * 40;
  tf('tap', `translate(${cx + drift * .6}px,${cy + drift}px)`);
  tf('tapDot', `scale(${lerp(1.25, 1, a) - press * .22})`);
  const rp = P(t, tp.t, .45, E.out);
  vis('tapRip', t >= tp.t ? (1 - rp) * .9 : 0); tf('tapRip', `scale(${1 + rp * 1.4})`);
}

// ─────────────────────────────────────────────────────────────────────────────
// ── homepage tour (real time) ───────────────────────────────────────────────
const CARD_STEP = 280.8 + 14.4, CARD_EDGE = 39.6;
const carIdx = (t, sw) => sw.reduce((x, s) => x + P(t, s, .45, E.out), 0);
const mix = (c1, c2, a) => `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], a))).join(',')})`;
function carousel(p, x, n) {
  tf(p + 'Track', `translateX(${CARD_EDGE - x * CARD_STEP}px)`);
  for (let i = 0; i < n; i++) {
    const a = clamp(1 - Math.abs(i - x));
    const c = $(p + 'c' + i);
    c.style.opacity = lerp(.4, 1, a); c.style.transform = `scale(${lerp(.97, 1, a)})`;
    $(p + 'b' + i).style.opacity = a;
    const d = $(p + 'd' + i);
    d.style.width = lerp(6, 24, a) + 'px'; d.style.background = mix([212, 212, 212], [37, 99, 235], a);
  }
}
function gestureU(t) {
  const g = GEST.find(x => t >= x.a - .3 && t <= x.b + .35);
  if (!g) return;
  let x, y, o, press = 0, rip = -1;
  if (g.k === 'tap') {
    const r = $(g.id).getBoundingClientRect();
    const ap = P(t, g.b - .5, .4), out = P(t, g.b + .15, .25, E.in);
    x = r.left + r.width / 2 + (1 - ap) * 24; y = r.top + r.height / 2 + (1 - ap) * 40;
    o = ap * (1 - out); press = bump(t, g.b, .12);
    if (t >= g.b) rip = P(t, g.b, .45);
  } else {
    const r = (g.k === 'up' ? $('pScreen') : $(g.id + 'Car')).getBoundingClientRect();
    const m = P(t, g.a, g.b - g.a, E.io);
    if (g.k === 'up') { x = r.left + r.width * .58; y = lerp(r.top + r.height * .78, r.top + r.height * .36, m); }
    else { x = lerp(r.left + r.width * .82, r.left + r.width * .28, m); y = r.top + r.height * .55; }
    o = P(t, g.a - .3, .3) * (1 - P(t, g.b, .3, E.in));
    press = t >= g.a && t <= g.b ? 1 : 0;
  }
  vis('tap', o);
  tf('tap', `translate(${x}px,${y}px)`);
  tf('tapDot', `scale(${1 - press * .18})`);
  vis('tapRip', rip >= 0 ? (1 - rip) * .9 : 0); tf('tapRip', `scale(${1 + Math.max(0, rip) * 1.4})`);
}
function showU(t) {
  if (t < TL.s1 || t > SHOW_END + 1) { ['hv0', 'hv1', 'hv2'].forEach(id => vis(id, 0)); return; }
  [['hv0', 10.4, 12.45], ['hv1', 12.45, 17.8], ['hv2', 17.8, 23.0]].forEach(([id, a, e]) => {
    vis(id, env(t, a, e, .5, .35)); tf(id, `translateY(${(1 - P(t, a, .5)) * 18}px)`);
  });
  let y = 0;
  SCROLLS.forEach(([a, d, y0, y1]) => { if (t >= a) y = lerp(y0, y1, P(t, a, d, E.io)); });
  tf('hScroll', `translateY(${-y}px)`);
  const sc = clamp(y / 300);
  $('hNavBar').style.background = `rgba(255,255,255,${.92 * sc})`;
  $('hNavBar').style.borderBottomColor = `rgba(229,229,229,${sc})`;
  $('hNavBar').style.boxShadow = `0 1px 2px rgba(0,0,0,${.05 * sc})`;
  carousel('g', carIdx(t, GAL_SW), GAL.length);
  carousel('s', carIdx(t, SOC_SW), N_SOC);
  gestureU(t);
}

function init() {
  build();
  buildSfx();
  // Measure where the form avatar sits once the phone has settled, so the
  // captured photo can fly exactly into it.
  seek(unwarp(SC.flyEnd));
  const r = $('formAv').getBoundingClientRect();
  FLY = { x: r.left + r.width / 2, y: r.top + r.height / 2, s: r.width / 348 };
  seek(0);
}
window.DUR = DUR; window.SFX = SFX; window.MUSIC = MUSIC; window.seek = seek; window.init = init;
if (!navigator.webdriver) window.addEventListener('load', () => { init(); let t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
</script>
