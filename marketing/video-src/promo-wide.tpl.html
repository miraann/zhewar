<body>
<div id="stage"></div>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  Helpers (shared with the vertical cut)
// ─────────────────────────────────────────────────────────────────────────────
/*@@HELPERS@@*/

// ─────────────────────────────────────────────────────────────────────────────
//  Story data
// ─────────────────────────────────────────────────────────────────────────────
/*@@STORY@@*/
const TAGLINE = 'لێرە کوالێتی و وردەکاری کۆدەبنەوە';
const ADDRESS = 'سلێمانی - نزیک شاری سپی';
const GAL = ['ستایلی مۆدێرن', 'بریندنی تایبەت', 'فەیدی کلاسیکی', 'چاکردنی ڕیش', 'فەیدی مۆدیرین'];
const N_SOC = 4;
window.STAGE_W = 960; window.STAGE_H = 540;

// ─────────────────────────────────────────────────────────────────────────────
//  Timeline. The booking flow runs on "b-time" (identical to the vertical cut);
//  this cut inserts a homepage tour at SHOW_A, freezing b-time for D seconds.
// ─────────────────────────────────────────────────────────────────────────────
const SHOW_A = 11.3, D = 12.5, SHOW_END = SHOW_A + D;
const DUR = 66.6 + D;
const warp = t => t < SHOW_A ? t : t < SHOW_END ? SHOW_A : t - D;
const unwarp = b => b < SHOW_A ? b : b + D;
let RT = 0;   // real time — for looping motion that must keep moving while b-time is frozen

const TL = { hook: 5.0, s1: 10.2, s2: 15.0, s3: 31.8, s4: 39.2, s5: 47.2, s6: 53.2, outro: 60.6 };
const SC = {
  zoom: 18.35, in: 18.5, loadEnd: 20.0, faceIn: 19.1, partial: 20.8,
  cA: 22.0, cB: 23.2, lock: 23.3, lmA: 23.5, meshA: 24.0,
  pushA: 25.0, blink: 25.85, flash: 26.5, capt: 26.65, btns: 27.1, use: 27.9,
  up: 28.25, benT: 28.7, ben: [28.95, 29.4, 29.85], out: 31.3, fly: 31.5, flyEnd: 32.45,
};
const TAPS = [
  { t: 14.1,  id: 'btnBook' },
  { t: 17.75, id: 'btnScan' },
  { t: SC.use, id: 'btnUse' },
  { t: 38.2,  id: 'btnStart' },
  { t: 40.7,  id: 'day' + SEL_DAY },
  { t: 43.9,  id: 'slot' + SEL_SLOT },
  { t: 45.9,  id: 'ctaDT' },
  { t: 51.9,  id: 'ctaSum' },
  { t: 56.2,  id: 'nfBtn' },
];
const TYPE = [
  { id: 'fName',  str: CUST,   a: 33.1, b: 34.3 },
  { id: 'fPhone', str: CPHONE, a: 34.6, b: 35.9 },
  { id: 'fNote',  str: NOTE,   a: 36.2, b: 36.9 },
];

// homepage tour (real time)
const GAL_SW = [13.9, 15.25, 16.6], SOC_SW = [19.3, 20.65, 22.0];
const SCROLLS = [[12.2, .8, 0, 695], [17.6, .8, 695, 1390], [22.85, .8, 1390, 0]];
const GEST = [
  { k: 'up', a: 12.05, b: 12.5 },
  ...GAL_SW.map(s => ({ k: 'left', a: s - .35, b: s, id: 'g' })),
  { k: 'up', a: 17.45, b: 17.9 },
  ...SOC_SW.map(s => ({ k: 'left', a: s - .35, b: s, id: 's' })),
  { k: 'tap', a: 22.75, b: 22.75, id: 'hNavLogo' },
];

const SFX = [];
const sfx = (name, t, vol = 1) => SFX.push({ name, t: +unwarp(t).toFixed(3), vol });   // b-time cue
const sfxR = (name, t, vol = 1) => SFX.push({ name, t: +t.toFixed(3), vol });          // real-time cue
const MUSIC = { groove0: 5.0, scanA: unwarp(18.35), scanB: unwarp(26.65), gap: [unwarp(26.42), unwarp(26.65)], outro: unwarp(60.6) };
function buildSfx() {
  sfx('impact', 0.25, .7); sfx('shimmer', 1.1, .5);
  sfx('whoosh', 4.6, .6);
  [0, 1, 2, 3].forEach(i => sfx('pop', 6.7 + i * .3, .7));
  sfx('whoosh', 9.75, .7); sfx('whoosh', TL.s1, .8);
  // homepage tour
  sfxR('pop', 12.5, .5); sfxR('pop', 17.85, .5);
  SCROLLS.forEach(([a]) => sfxR('whoosh', a, .5));
  [...GAL_SW, ...SOC_SW].forEach(s => sfxR('swipe', s - .12, .8));
  sfxR('tap', 22.75, 1);
  // booking flow (b-time, same cues as the vertical cut)
  TAPS.forEach(tp => sfx('tap', tp.t, 1));
  [14.75, TL.s3 - .1, TL.s4, TL.s5, TL.s6].forEach(t => sfx('whoosh', t, .55));
  sfx('whooshBig', SC.zoom, 1);
  for (let t = SC.loadEnd; t < SC.lock - .2; t += .6) sfx('blip', t, .55);
  sfx('lock', SC.lock, 1);
  for (let i = 0; i < 14; i++) sfx('tick', SC.lmA + i * .095, .45);
  sfx('riser', SC.pushA, .9);
  sfx('shutter', SC.flash, 1);
  sfx('chime', SC.capt + .12, .8);
  sfx('whoosh', SC.up, .6);
  SC.ben.forEach(t => sfx('pop', t, .7));
  sfx('whoosh', SC.fly, .8); sfx('pop', SC.flyEnd + .05, .8);
  TYPE.forEach(f => { const n = Array.from(f.str).length; for (let i = 0; i < n; i++) sfx('type', f.a + (f.b - f.a) * (i + .5) / n, .6); });
  [40.75, 43.95].forEach(t => sfx('pop', t + .05, .45));
  sfx('success', 53.45, 1);
  sfx('notif', 55.0, 1);
  sfx('sparkle', 57.35, .9);
  sfx('whoosh', 60.1, .7); sfx('impact', TL.outro + .2, .9); sfx('shimmer', 62.0, .6);
  SFX.sort((a, b) => a.t - b.t);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Face illustration + 68-point landmark model (shared)
// ─────────────────────────────────────────────────────────────────────────────
/*@@FACE@@*/

// ─────────────────────────────────────────────────────────────────────────────
//  DOM
// ─────────────────────────────────────────────────────────────────────────────
function build() {
  const logoRing = (id, sz, extra = '') => `<div class="aring" style="width:${sz}px;height:${sz}px;${extra}"><div class="cg" id="${id}"></div><div class="w"></div><img src="logo.png"></div>`;
  const hdr = (id, pill, title, sub, extra = '') => `
    <div class="hdr" id="${id}">
      <div class="pill">${pill}</div>
      <div class="ht">${title}</div>
      ${sub}
      ${extra ? `<div class="hx">${extra}</div>` : ''}
    </div>`;
  const pnum = (n, word) => `<span class="pn">${KD(n)}</span><span>هەنگاوی ${word}</span>`;
  const picon = (icon, label) => `<span class="pn">${ic(icon, 14)}</span><span>${label}</span>`;
  const row = (id, icon, label, val = '', { check = true, vst = '', vdir = '' } = {}) => `
    <div class="row" id="${id}"><span class="ri">${ic(icon, 18)}</span><span>${label}</span>
      <span class="rv" id="${id}v" ${vdir ? `dir="${vdir}"` : ''} style="${vst}">${val}</span>
      ${check ? `<span class="rk" id="${id}k">${ic('check', 14, 'stroke-width:3')}</span>` : ''}</div>`;
  const statusBar = `<div class="sbar"><span>9:41</span><span style="display:flex;gap:5px;align-items:center">${ic('signal', 16)}${ic('wifi', 16)}${ic('battery-full', 20)}</span></div><div class="island"></div>
    <div class="ubar"><div class="upill">${ic('lock', 13, 'color:#16a34a')}<span>zhewar.shop</span></div></div>`;
  const cards = (p, n, caps) => Array.from({ length: n }, (_, i) => `
    <div class="card" id="${p}c${i}"><img src="site/${p}${i}.jpg"><div class="shade"></div><div class="cbord" id="${p}b${i}"></div>
      ${caps ? `<div class="cap"><p>${caps[i]}</p><i></i></div>` : ''}</div>`).join('');
  const cdots = (p, n) => Array.from({ length: n }, (_, i) => `<span id="${p}d${i}"></span>`).join('');
  const days = DAYS.map((d, i) => `
    <div class="day ${i === 0 ? 'today' : ''} ${d.dow === 5 ? 'off' : ''}" id="day${i}">
      <span class="dn">${DAY_SHORT[d.dow]}</span><span class="dd">${d.d}</span><span class="dt"></span>
    </div>`).join('');
  const slots = SLOTS.map((s, i) => `<div class="slot ${SLOT_ST[i]}" id="slot${i}">${formatTimeFull(s)}</div>`).join('');
  const skels = Array.from({ length: 8 }, (_, i) => `<div class="skel" id="sk${i}"></div>`).join('');
  const gc = (bg, fg, icon, label, val, cls = '') => `
    <div class="gc" ${cls}><div class="gi" style="background:${bg};color:${fg}">${icon}</div>
      <div style="min-width:0"><div class="gl">${label}</div><div class="gv">${val}</div></div></div>`;
  const logoImg = '<img src="logo.png" style="width:20px;height:20px;border-radius:6px">';

  $('stage').innerHTML = `
  <div id="bg" class="L">
    <div id="bgBase" class="L"></div>
    <div id="bgStripes" class="L"></div>
    <div id="blobB" class="A blob"></div>
    <div id="blobR" class="A blob"></div>
    <div id="blobG" class="A blob"></div>
    <div id="bgScan" class="L"></div>
    <div id="vignette" class="L"></div>
  </div>

  <!-- INTRO -->
  <div id="intro" class="L">
    <div id="iLogo" class="A" style="left:390px;top:85px;width:180px;height:180px">
      <div class="A" style="inset:-60px;border-radius:50%;background:radial-gradient(circle,rgba(226,188,116,.32),rgba(226,188,116,0) 66%)"></div>
      <div id="iOrbit1" class="orbit" style="inset:-22px"></div>
      <div id="iOrbit2" class="orbit" style="inset:-42px;border-color:rgba(96,165,250,.16)"></div>
      <div class="logoRing" style="inset:0"><div class="cg" id="iRing"></div><div class="in"></div><img src="logo.png"></div>
    </div>
    <div id="iGold" class="A goldLbl" style="left:0;right:0;top:280px">بەخێربێن بۆ سەرتاشخانەی</div>
    <div id="iName" class="A bigName" style="left:0;right:0;top:304px">${SHOP}</div>
    <div id="iDiv" class="A divider" style="left:0;right:0;top:384px"><i style="background:linear-gradient(to right,transparent,#ef4444)"></i><span class="diamond"></span><i style="background:linear-gradient(to left,transparent,#3b82f6)"></i></div>
    <div id="iTag" class="A tagline" style="left:0;right:0;top:402px">${TAGLINE}</div>
  </div>

  <!-- HOOK -->
  <div id="hook" class="L">
    <div id="hk1" class="hookLine" style="top:114px">هەموو شتێک لە یەک شوێن</div>
    <div id="hk2" class="hookLine" style="top:166px">ببینە، <span class="grad">تۆمار بکە</span></div>
    <div id="hk3" class="A" style="left:0;right:0;top:244px;text-align:center;font-size:19px;color:#94a3b8">کارەکانمان، پۆستەکانمان و تۆمارکردنی کات</div>
    <div id="rmLine" style="left:225px;width:510px;top:350px"></div>
    ${[['images', 'کارەکانمان'], ['share-2', 'سۆشیاڵ میدیا'], ['scan-face', 'سکانی ڕووخسار'], ['calendar', 'تۆمارکردن']].map(([icn, lbl], i) => `
      <div class="rmNode fx" id="rm${i}" style="left:${[735, 565, 395, 225][i]}px;top:352px">${ic(icn, 38)}<span class="rmNum fx">${KD(i + 1)}</span></div>
      <div class="rmLbl" id="rl${i}" style="left:${[735, 565, 395, 225][i]}px;top:410px">${lbl}</div>`).join('')}
  </div>

  <!-- RIGHT COLUMN: tour + step headers -->
  <div id="segs" class="A">${[0, 1, 2, 3, 4, 5].map(i => `<div class="seg"><b id="seg${i}"></b></div>`).join('')}</div>
  ${hdr('hv0', picon('globe', 'ماڵپەڕ'), 'سەردانی <span class="grad lat">zhewar.shop</span> بکە', `<div class="hs">ماڵپەڕی فەرمیی سەرتاشخانەکە</div>`,
    `<div class="quote" id="hv0q">«${TAGLINE}»</div><div><span class="chip" id="hv0a">📍 ${ADDRESS}</span></div>`)}
  ${hdr('hv1', picon('images', 'گالری'), '<span class="grad">کارەکانمان</span> ببینە', `<div class="hs">فەید، ستایلی مۆدێرن و چاکردنی ڕیش</div>`,
    `<div style="display:flex;flex-direction:column;gap:6px">${GAL.map((c, i) => `<div class="crow" id="cr${i}"><img src="site/g${i}.jpg"><span>${c}</span><span class="n">${KD(i + 1)}</span></div>`).join('')}</div>`)}
  ${hdr('hv2', picon('share-2', 'سۆشیاڵ میدیا'), 'دوایین <span class="grad">پۆستەکانمان</span>', `<div class="hs">ڕاستەوخۆ لە پەیجەکانمانەوە</div>`,
    `<div class="thumbs">${Array.from({ length: N_SOC }, (_, i) => `<div id="th${i}"><img src="site/s${i}.jpg"></div>`).join('')}</div>`)}
  ${hdr('h1', pnum(1, 'یەکەم'), 'دەست بکە بە <span class="grad">تۆمارکردن</span>', `<div class="hs">دوگمەی «ناو تۆمار کردن» دابگرە</div>`)}
  ${hdr('h2', pnum(2, 'دووەم'), 'سکانی <span class="grad">ڕووخسار</span>', `<div class="hs">ئەگەر چالاک بێت، سەرەتا ڕووخسارت سکان دەکرێت</div>`)}
  ${hdr('h3', pnum(3, 'سێیەم'), 'زانیارییەکانت <span class="grad">بنووسە</span>', `<div class="hs">ناو و ژمارەی مۆبایل — تەنها بۆ یەکەمجار</div>`,
    row('x3r0', 'user', 'ناوی تەواو') + row('x3r1', 'phone', 'ژمارەی مۆبایل', '', { vdir: 'ltr', vst: "font-family:'Segoe UI',sans-serif" }) + row('x3r2', 'pencil', 'تێبینی (ئارەزوومەند)'))}

  <!-- OUTRO: logo right, text left (RTL lockup) -->

}

// ─────────────────────────────────────────────────────────────────────────────
//  Per-frame update
// ─────────────────────────────────────────────────────────────────────────────
let FLY = null;
const SW_CX = 288, SW_CY = 280, SW_S = 340 / 380;   // scanner rest centre + scale

function seek(t) {
  RT = t;
  const b = warp(t);
  bgU(t, b); introU(b); hookU(b); hdrU(b); extrasU(b); phoneU(b); scanU(b); outroU(b); tapU(b); showU(t);
  vis('flash', b >= SC.flash && b < SC.flash + .5 ? .8 * (1 - P(b, SC.flash, .45, E.out)) : 0);
  vis('fade', Math.max(1 - P(t, 0, .5), P(t, DUR - .8, .8, E.io)));
}

function bgU(t, b) {
  const o = (t * 12) % 141;
  $('bgStripes').style.backgroundPosition = `${o}px ${o}px`;
  tf('blobB', `translate(${780 + Math.sin(t * .35) * 50}px,${120 + Math.cos(t * .3) * 40}px)`);
  tf('blobR', `translate(${170 + Math.cos(t * .28) * 50}px,${470 + Math.sin(t * .33) * 40}px)`);
  tf('blobG', `translate(480px,200px)`);
  vis('blobG', Math.max(1 - P(b, 4.6, 1), P(b, TL.outro, 1)));
  vis('bgScan', env(b, SC.zoom, SC.flyEnd, .8, .9));
}

function introU(t) {
  if (t > TL.s1 + .5) { vis('intro', 0); return; }
  vis('intro', 1);
  const pin = P(t, .25, 1.1, E.back);
  const mv = P(t, 4.55, .8, E.io);
  const sc = lerp(lerp(.55, 1, pin), .44, mv);
  const ty = lerp(0, -113, mv);
  const out = P(t, 9.7, .5, E.in);
  vis('iLogo', Math.min(P(t, .25, .5), 1 - out));
  tf('iLogo', `translateY(${ty - out * 24}px) scale(${sc})`);
  tf('iRing', `rotate(${t * 360 / 3.5}deg)`);
  tf('iOrbit1', `rotate(${-t * 20}deg)`); tf('iOrbit2', `rotate(${t * 12}deg)`);
  vis('iOrbit1', 1 - mv); vis('iOrbit2', 1 - mv);
  const ex = P(t, 4.45, .5, E.in);
  const item = (id, a) => { const p = P(t, a, .75); vis(id, p * (1 - ex)); tf(id, `translateY(${(1 - p) * 24 - ex * 26}px)`); };
  item('iGold', .95); item('iName', 1.15); item('iTag', 1.85);
  const pd = P(t, 1.55, .8);
  vis('iDiv', pd * (1 - ex)); tf('iDiv', `scaleX(${pd}) translateY(${-ex * 26}px)`);
}

function hookU(t) {
  if (t < TL.hook - .1 || t > TL.s1 + .3) { vis('hook', 0); return; }
  vis('hook', 1);
  const ex = P(t, 9.7, .5, E.in);
  const line = (id, a) => { const p = P(t, a, .7); vis(id, p * (1 - ex)); tf(id, `translateY(${(1 - p) * 26 - ex * 20}px)`); };
  line('hk1', 5.15); line('hk2', 5.45); line('hk3', 6.25);
  vis('rmLine', 1 - ex); tf('rmLine', `scaleX(${P(t, 6.65, 1.3, E.io)})`);
  for (let i = 0; i < 4; i++) {
    const p = P(t, 6.7 + i * .3, .5, E.back);
    vis('rm' + i, clamp(p * 3) * (1 - ex));
    let extra = '';
    if (i === 2) {   // the face-scan node gets the spotlight
      const g = P(t, 7.9, .6), pulse = .5 + .5 * Math.sin(t * 5);
      $('rm2').style.borderColor = `rgba(52,211,153,${.15 + g * .7})`;
      $('rm2').style.boxShadow = `0 0 ${g * (22 + pulse * 16)}px rgba(16,185,129,${g * .55})`;
      $('rm2').style.color = g > .5 ? '#6ee7b7' : '#93c5fd';
      extra = ` scale(${1 + g * .08})`;
    }
    tf('rm' + i, `scale(${p})${extra}`);
    const pl = P(t, 6.9 + i * .3, .5);
    vis('rl' + i, pl * (1 - ex)); tf('rl' + i, `translateY(${(1 - pl) * 12}px)`);
  }
}

const hdrIn = (id, o, a, t) => { vis(id, o); tf(id, `translateY(${(1 - P(t, a, .5)) * 18}px)`); };
function hdrU(b) {
  const tour = P(RT, SHOW_END - .1, .5);
  vis('segs', env(b, TL.s1, TL.outro, .5, .5) * tour);
  const starts = [TL.s1, TL.s2, TL.s3, TL.s4, TL.s5, TL.s6];
  for (let i = 0; i < 6; i++) $('seg' + i).style.width = (P(b, starts[i], .6, E.io) * 100) + '%';
  const H = [['h1', 10.4, 14.95], ['h2', 15.15, SC.up + .2], ['h3', 31.95, 39.1], ['h4', 39.35, 47.1], ['h5', 47.35, 53.1], ['h6', 53.35, 60.35]];
  H.forEach(([id, a, e]) => {
    let o = env(b, a, e, .5, .35);
    if (id === 'h1') o *= tour;
    hdrIn(id, o, id === 'h1' ? SHOW_END : a, id === 'h1' ? RT : b);
  });
  const sw = P(b, 57.2, .4);
  vis('h6a', 1 - sw); vis('h6b', sw);
}

// right-column details that mirror what happens on the phone
const rowIn = (id, a, b) => { const p = P(b, a, .45); vis(id, p); tf(id, `translateX(${(1 - p) * 26}px)`); };
const checkPop = (id, a, b) => { const p = P(b, a, .35, E.back); vis(id + 'k', clamp(p * 2)); tf(id + 'k', `scale(${p})`); };
function extrasU(b) {
  if (b > 31 && b < 40) TYPE.forEach((f, i) => {
    rowIn('x3r' + i, 32.3 + i * .15, b);
    const chars = Array.from(f.str), n = Math.round(clamp((b - f.a) / (f.b - f.a)) * chars.length);
    $('x3r' + i + 'v').textContent = chars.slice(0, n).join('');
    checkPop('x3r' + i, f.b + .05, b);
  });
  if (b > 39 && b < 48) {
    rowIn('x4r0', 39.7, b); rowIn('x4r1', 39.85, b);
    $('x4r0v').textContent = b >= 40.75 ? 'دووشەممە 5/10' : '—';
    $('x4r1v').textContent = b >= 43.95 ? SEL_TIME : '—';
    checkPop('x4r0', 40.75, b); checkPop('x4r1', 43.95, b);
  }
  if (b > 47 && b < 54) for (let i = 0; i < 4; i++) rowIn('x5r' + i, 47.6 + i * .2, b);
  if (b > 53) {
    const pin = P(b, 54.9, .5, E.back), pout = P(b, 56.95, .35, E.in);
    vis('notif', env(b, 54.9, 57.3, .35, .35));
    tf('notif', `translateX(${(1 - pin) * 60 - pout * 60}px)`);
    const done = b >= 56.25;
    $('nfBtn').style.background = done ? '#10b981' : '#2563eb';
    $('nfA').style.display = done ? 'none' : 'inline';
    $('nfB').style.display = done ? 'flex' : 'none';
    const sc = P(b, 57.35, .55, E.back);
    vis('stCard', clamp(sc * 2)); tf('stCard', `scale(${lerp(.85, 1, sc)})`);
  }
}

// ── phone ───────────────────────────────────────────────────────────────────
const SCREENS = [
  ['scHome', 10.2, 14.95], ['scReg', 14.75, 19.1], ['scForm', 31.7, 39.45],
  ['scDT', 39.2, 47.45], ['scSum', 47.2, 53.45], ['scOk', 53.2, 61.2],
];
function phoneU(t) {
  const on1 = t >= TL.s1 - .05 && t < 19.05, on2 = t >= SC.fly && t < TL.outro + .7;
  if (!on1 && !on2) { vis('phone', 0); vis('phoneGlow', 0); return; }
  let y = 0, s = 1, o = 1, rotY = Math.sin(RT * .6) * 3, rotX = Math.cos(RT * .5) * 1.5;
  const fl = Math.sin(RT * 1.2) * 5;
  if (on1) {
    y = (1 - P(t, TL.s1, .95, E.out5)) * 780;
    const z = P(t, SC.zoom, .65, E.in);
    s = lerp(1, 2.7, z); o = 1 - P(t, SC.zoom + .08, .32);
    if (z > 0) { rotY *= 1 - z; rotX *= 1 - z; }
  } else {
    const p = P(t, SC.fly + .2, .8, E.out);
    s = lerp(1.1, 1, p); o = p;
    const ex = P(t, TL.outro - .55, .6, E.in);
    y = ex * 260; o *= 1 - ex; s *= 1 - ex * .1;
  }
  $('phone').style.transformOrigin = '165px 390px';
  vis('phone', o);
  tf('phone', `translateY(${y + fl}px) perspective(1600px) rotateY(${rotY}deg) rotateX(${rotX}deg) scale(${s})`);
  vis('phoneGlow', o * .9); tf('phoneGlow', `translateY(${y * .714}px)`);

  $('appStripes').style.backgroundPosition = `${(RT * 6) % 141}px ${(RT * 6) % 141}px`;
  SCREENS.forEach(([id, a, e]) => {
    const pin = P(t, a, .45, E.out), pout = P(t, e - .45, .45, E.in);
    const o2 = (a <= TL.s1 + .01 ? (t >= a ? 1 : 0) : pin) * (1 - pout);
    vis(id, o2);
    tf(id, `translateX(${(1 - pin) * -60 + pout * 60}px)`);
  });
  tf('homeRing', `rotate(${RT * 360 / 3.5}deg)`);
  tf('regRing', `rotate(${RT * 360 / 4}deg)`);
  tf('formRing', `rotate(${RT * 360 / 4}deg)`);
  $('hPole').style.backgroundPosition = `${(RT * 47) % 113}px 0`;
  vis('camOv', P(t, 17.95, .3));
  tf('miniRing', `rotate(${RT * 360 / 2.2}deg)`);
  tf('miniSpin', `rotate(${RT * 360 / .8}deg)`);
  formU(t); dtU(t); sumU(t); okU(t);
}

// ── face scan ───────────────────────────────────────────────────────────────
/*@@SCAN_HELPERS@@*/

function scanU(t) {
  const onA = t >= SC.in - .05 && t < SC.flyEnd + .1;
  if (!onA) { vis('scan', 0); return; }
  vis('scan', 1);
  const ph = phase(t);

  // phone camera ring → big scanner; push-in on the blink; shrink for the benefits; fly into the form avatar
  const pin = P(t, SC.in, .65, E.out);
  let tx = lerp(11.8, 0, pin), ty = lerp(18.5, 0, pin), s = lerp(.31, SW_S, pin);
  const push = P(t, SC.pushA, 1.4, E.io) * (1 - P(t, SC.capt, .5, E.io));
  s *= 1 + push * .06;
  const up = P(t, SC.up, .85, E.io);
  s = lerp(s, .8, up);
  if (FLY) {
    const f = P(t, SC.fly, SC.flyEnd - SC.fly, E.io);
    tx = lerp(tx, FLY.x - SW_CX, f); ty = lerp(ty, FLY.y - SW_CY, f); s = lerp(s, FLY.s, f);
  }
  vis('scanWrap', Math.min(P(t, SC.in, .3), t > SC.flyEnd - .05 ? 0 : 1));
  tf('scanWrap', `translate(${tx}px,${ty}px) scale(${s})`);
  const flying = P(t, SC.fly, .35);
  vis('sTitle', env(t, SC.in + .2, SC.up + .2, .4, .3));

  const ringO = 1 - flying;
  const ring = $('sRing');
  vis(ring, ringO); vis('sInner', ringO);
  if (ph === 'loading' || ph === 'searching') {
    ring.style.background = 'conic-gradient(#f59e0b 0deg,#f59e0b 180deg,transparent 180deg)';
    tf(ring, `rotate(${t * 360 / 2.2}deg)`);
  } else if (ph === 'found') {
    ring.style.background = 'conic-gradient(#10b981 0deg,#6ee7b7 90deg,#10b981 180deg,#059669 270deg,#10b981 360deg)';
    tf(ring, `rotate(${t * 360 / 1.2}deg)`);
  } else {
    ring.style.background = '#10b981'; tf(ring, 'none');
  }
  vis('sOuterA', ph === 'searching' ? (.55 + .45 * Math.sin(t * Math.PI)) * ringO : 0);
  vis('sOuterG', (ph === 'found' || ph === 'captured') ? ringO * (ph === 'found' ? 1 : .7) : 0);
  const bcol = ph === 'found' ? '#10b981' : '#fbbf24';
  for (let i = 0; i < 4; i++) { const bk = $('bk' + i); bk.style.borderColor = bcol; vis(bk, ph === 'searching' || ph === 'found' ? 1 : 0); }
  const bd = vis('sBadge', ph === 'found' ? P(t, SC.lock, .35) : 0);
  tf(bd, `translateX(-50%) scale(${lerp(.7, 1, P(t, SC.lock, .35, E.back))})`);
  vis('sBadgeDot', .4 + .6 * Math.abs(Math.sin(t * 3)));

  vis('sDim', ph === 'loading' ? 1 : 1 - P(t, SC.loadEnd, .3));
  tf('sSpin', `rotate(${t * 360 / .8}deg)`);
  const lt = ((t - SC.loadEnd) % 2.2) / 2.2;
  const lineEl = vis('sLine', ph === 'searching' ? (lt < .08 ? lt / .08 : lt > .92 ? (1 - lt) / .08 : 1) : 0);
  lineEl.style.top = (18 + lt * 64) + '%';
  const sw = P(t, SC.lock, .9, E.io);
  vis('sSweep', ph === 'found' && sw < 1 ? 1 : 0); $('sSweep').style.top = (lerp(-90, 348, sw)) + 'px';
  const prog = ph === 'found' ? clamp((t - SC.lock) / 3.4) * 100 : 0;
  $('sArc').style.background = `conic-gradient(rgba(52,211,153,.85) ${prog * 3.6}deg, transparent ${prog * 3.6}deg)`;
  vis('sArc', ph === 'found' ? 1 : 0);
  $('sBar').style.width = prog + '%';
  const okp = P(t, SC.capt + .1, .45, E.back);
  vis('sOk', ph === 'captured' ? clamp(P(t, SC.capt, .2)) * (1 - flying) : 0);
  tf('sOkC', `scale(${okp})`);
  $('cam').style.boxShadow = `0 0 0 ${flying * 3}px #bfdbfe`;

  const [fx, fy, fr, fs] = facePose(t);
  $('scpose').setAttribute('transform', poseStr(fx, fy, fr, fs));
  const bl = blinkAt(t);
  $('sclidR').setAttribute('d', lidD(82, bl)); $('sclashR').setAttribute('d', lashD(82, bl));
  $('sclidL').setAttribute('d', lidD(118, bl)); $('sclashL').setAttribute('d', lashD(118, bl));

  const box = $('scbox');
  const boxO = ph === 'searching' ? P(t, SC.partial, .3) : ph === 'found' ? 1 - P(t, SC.lmA + .6, .5) : 0;
  if (boxO > 0) {
    const rr = Math.abs(fr) * Math.PI / 180;
    const hw = fs * (44 * Math.cos(rr) + 54 * Math.sin(rr)), hh = fs * (56 * Math.cos(rr) + 44 * Math.sin(rr));
    const cx = 100 + fx, cy = 93 + fy;
    box.setAttribute('x', cx - hw); box.setAttribute('y', cy - hh); box.setAttribute('width', hw * 2); box.setAttribute('height', hh * 2);
    box.setAttribute('stroke', ph === 'found' ? '#34d399' : '#fbbf24');
    box.setAttribute('stroke-dashoffset', -t * 12);
  }
  box.setAttribute('opacity', boxO);

  const lmOn = (ph === 'found' || (ph === 'captured' && t < SC.capt + .25));
  const lmFade = ph === 'captured' ? 1 - P(t, SC.capt, .2) : 1;
  const blinkDim = 1 - .7 * clamp(1 - Math.abs(t - (SC.blink + .2)) / .45);
  $('scpts').setAttribute('opacity', lmOn ? lmFade * blinkDim : 0);
  $('scmesh').setAttribute('opacity', lmOn ? lmFade * blinkDim : 0);
  if (lmOn) {
    const L = landmarks(bl);
    const glowEye = bl > 0 ? 1 : 0;
    for (let i = 0; i < 68; i++) {
      const p = P(t, SC.lmA + i * (1.25 / 68), .28, E.back);
      const eyeBoost = (i >= 36 && i <= 47) ? 1 + glowEye * .15 : 1;
      $('lp' + i).setAttribute('transform', `translate(${L[i][0]} ${L[i][1]}) scale(${Math.max(0, p) * eyeBoost})`);
    }
    MESH.forEach((seq, j) => {
      const el = $('lm' + j);
      el.setAttribute('d', 'M' + seq.map(k => L[k][0].toFixed(2) + ',' + L[k][1].toFixed(2)).join('L'));
      el.setAttribute('stroke-dashoffset', 1 - P(t, SC.meshA + j * (1.1 / MESH.length), .4, E.io));
    });
  }

  const txt = (id, a, e) => { const o = env(t, a, e, .3, .25); vis(id, o); tf(id, `translateY(${(1 - P(t, a, .3)) * 10}px)`); };
  txt('txLoad', SC.in + .3, SC.loadEnd);
  txt('txSearch', SC.loadEnd, SC.partial);
  txt('txPartial', SC.partial, SC.lock);
  txt('txFound', SC.lock, SC.capt);
  txt('txCapt', SC.capt, SC.up + .15);
  for (let i = 0; i < 3; i++) {
    const v = .3 + .7 * (.5 + .5 * Math.sin((t - i * .2) * Math.PI * 2 / 1.4));
    vis('dA' + i, v); vis('dB' + i, v);
    tf('dA' + i, `scale(${.8 + .4 * v})`); tf('dB' + i, `scale(${.8 + .4 * v})`);
  }
  const pulse = t > SC.pushA && t < SC.blink + .4 ? .5 + .5 * Math.sin(t * 9) : 0;
  $('blinkTx').style.textShadow = `0 0 ${pulse * 18}px rgba(52,211,153,.9)`;
  const sb = P(t, SC.btns, .4, E.back);
  vis('sBtns', clamp(sb * 2) * (1 - P(t, SC.up, .25)));
  tf('sBtns', `translateY(${(1 - sb) * 16}px)`);
  $('btnUse').style.scale = 1 - bump(t, SC.use, .14) * .05;

  const chip = (id, a, e) => { const o = env(t, a, e, .4, .3); vis(id, o); tf(id, `translateY(${(1 - P(t, a, .4)) * 20}px) scale(${lerp(.92, 1, P(t, a, .4, E.back))})`); };
  chip('fc0', SC.partial + .1, SC.cB);
  chip('fc1', SC.lmA + .1, SC.blink - .25);
  chip('fc2', SC.blink - .2, SC.up + .1);

  const bo = 1 - P(t, SC.out, .4, E.in);
  const bT = P(t, SC.benT, .5);
  vis('benT', bT * bo); tf('benT', `translateY(${(1 - bT) * 20}px)`);
  SC.ben.forEach((a, i) => {
    const p = P(t, a, .55, E.out);
    vis('bn' + i, p * bo); tf('bn' + i, `translateX(${(1 - p) * 60}px)`);
  });
}

// ── homepage tour (real time) ───────────────────────────────────────────────
const CARD_STEP = 280.8 + 14.4, CARD_EDGE = 39.6;
const carIdx = (t, sw) => sw.reduce((x, s) => x + P(t, s, .45, E.out), 0);
const mix = (c1, c2, a) => `rgb(${c1.map((v, i) => Math.round(lerp(v, c2[i], a))).join(',')})`;
function carousel(p, x, n) {
  tf(p + 'Track', `translateX(${CARD_EDGE - x * CARD_STEP}px)`);
  for (let i = 0; i < n; i++) {
    const a = clamp(1 - Math.abs(i - x));
    const c = $(p + 'c' + i);
    c.style.opacity = lerp(.4, 1, a); c.style.transform = `scale(${lerp(.97, 1, a)})`;
    $(p + 'b' + i).style.opacity = a;
    const d = $(p + 'd' + i);
    d.style.width = lerp(6, 24, a) + 'px'; d.style.background = mix([212, 212, 212], [37, 99, 235], a);
  }
}
function gestureU(t) {
  const g = GEST.find(x => t >= x.a - .3 && t <= x.b + .35);
  if (!g) return;
  let x, y, o, press = 0, rip = -1;
  if (g.k === 'tap') {
    const r = $(g.id).getBoundingClientRect();
    const ap = P(t, g.b - .5, .4), out = P(t, g.b + .15, .25, E.in);
    x = r.left + r.width / 2 + (1 - ap) * 20; y = r.top + r.height / 2 + (1 - ap) * 34;
    o = ap * (1 - out); press = bump(t, g.b, .12);
    if (t >= g.b) rip = P(t, g.b, .45);
  } else {
    const r = (g.k === 'up' ? $('pScreen') : $(g.id + 'Car')).getBoundingClientRect();
    const m = P(t, g.a, g.b - g.a, E.io);
    if (g.k === 'up') { x = r.left + r.width * .58; y = lerp(r.top + r.height * .78, r.top + r.height * .36, m); }
    else { x = lerp(r.left + r.width * .82, r.left + r.width * .28, m); y = r.top + r.height * .55; }
    o = P(t, g.a - .3, .3) * (1 - P(t, g.b, .3, E.in));
    press = t >= g.a && t <= g.b ? 1 : 0;
  }
  vis('tap', o);
  tf('tap', `translate(${x}px,${y}px)`);
  tf('tapDot', `scale(${1 - press * .18})`);
  vis('tapRip', rip >= 0 ? (1 - rip) * .9 : 0); tf('tapRip', `scale(${1 + Math.max(0, rip) * 1.4})`);
}
function showU(t) {
  if (t < TL.s1 || t > SHOW_END + 1) { ['hv0', 'hv1', 'hv2'].forEach(id => vis(id, 0)); return; }
  const HV = [['hv0', 10.4, 12.45], ['hv1', 12.45, 17.8], ['hv2', 17.8, 23.0]];
  HV.forEach(([id, a, e]) => hdrIn(id, env(t, a, e, .5, .35), a, t));
  const q = P(t, 10.9, .5); vis('hv0q', q); tf('hv0q', `translateY(${(1 - q) * 12}px)`);
  const ad = P(t, 11.2, .5); vis('hv0a', ad); tf('hv0a', `translateY(${(1 - ad) * 12}px)`);

  let y = 0;
  SCROLLS.forEach(([a, d, y0, y1]) => { if (t >= a) y = lerp(y0, y1, P(t, a, d, E.io)); });
  tf('hScroll', `translateY(${-y}px)`);
  const sc = clamp(y / 300);
  $('hNavBar').style.background = `rgba(255,255,255,${.92 * sc})`;
  $('hNavBar').style.borderBottomColor = `rgba(229,229,229,${sc})`;
  $('hNavBar').style.boxShadow = `0 1px 2px rgba(0,0,0,${.05 * sc})`;

  const gi = carIdx(t, GAL_SW), si = carIdx(t, SOC_SW);
  carousel('g', gi, GAL.length); carousel('s', si, N_SOC);
  GAL.forEach((_, i) => {
    const a = clamp(1 - Math.abs(i - gi)), p = P(t, 12.8 + i * .12, .4);
    const r = vis('cr' + i, p);
    r.style.background = `rgba(37,99,235,${.04 + a * .26})`;
    r.style.borderColor = `rgba(96,165,250,${.1 + a * .55})`;
    r.style.color = a > .5 ? '#fff' : '#94a3b8';
    tf(r, `translateX(${(1 - p) * 24}px) scale(${1 + a * .03})`);
  });
  for (let i = 0; i < N_SOC; i++) {
    const a = clamp(1 - Math.abs(i - si)), p = P(t, 18.2 + i * .12, .45, E.back);
    const th = vis('th' + i, clamp(p * 2) * lerp(.45, 1, a));
    th.style.borderColor = `rgba(96,165,250,${a})`;
    tf(th, `scale(${lerp(.8, 1, p) * (1 + a * .06)})`);
  }
  gestureU(t);
}

// ── outro ───────────────────────────────────────────────────────────────────
function outroU(t) {
  if (t < TL.outro - .1) { vis('outro', 0); return; }
  vis('outro', 1);
  const l = P(t, TL.outro + .15, 1.0, E.back);
  vis('oLogo', clamp(l * 2)); tf('oLogo', `scale(${lerp(.4, 1, l)})`);
  tf('oRing', `rotate(${t * 360 / 3.5}deg)`); tf('oOrbit', `rotate(${-t * 18}deg)`);
  const it = (id, a) => { const p = P(t, a, .7); vis(id, p); tf(id, `translateX(${(1 - p) * 30}px)`); };
  it('oName', 61.0); it('oCta', 61.35);
  const u = P(t, 61.85, .7, E.back);
  vis('oUrl', clamp(u * 2)); tf('oUrl', `scale(${lerp(.7, 1, u)})`); $('oUrl').style.transformOrigin = '100% 50%';
  it('oTag', 62.4); it('oAddr', 62.7);
}

// ── tap indicator (booking flow) ────────────────────────────────────────────
function tapU(t) {
  const tp = TAPS.find(x => t >= x.t - .55 && t <= x.t + .5);
  TAPS.forEach(x => { const el = $(x.id); if (el && x.id !== 'btnUse') el.style.scale = 1 - bump(t, x.t, .14) * .05; });
  if (!tp || (RT >= SHOW_A && RT < SHOW_END)) { vis('tap', 0); return; }
  const r = $(tp.id).getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const a = P(t, tp.t - .55, .4, E.out);
  const out = P(t, tp.t + .2, .3, E.in);
  vis('tap', a * (1 - out));
  const press = bump(t, tp.t, .12);
  const drift = (1 - a) * 34;
  tf('tap', `translate(${cx + drift * .6}px,${cy + drift}px)`);
  tf('tapDot', `scale(${lerp(1.25, 1, a) - press * .22})`);
  const rp = P(t, tp.t, .45, E.out);
  vis('tapRip', t >= tp.t ? (1 - rp) * .9 : 0); tf('tapRip', `scale(${1 + rp * 1.4})`);
}

// ─────────────────────────────────────────────────────────────────────────────
function init() {
  build();
  buildSfx();
  seek(unwarp(SC.flyEnd));
  const r = $('formAv').getBoundingClientRect();
  FLY = { x: r.left + r.width / 2, y: r.top + r.height / 2, s: r.width / 348 };
  seek(0);
}
window.DUR = DUR; window.SFX = SFX; window.MUSIC = MUSIC; window.seek = seek; window.init = init;
if (!navigator.webdriver) window.addEventListener('load', () => { init(); const t0 = performance.now(); (function loop() { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })(); });
</script>
